<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b6bcb"/>
      <stop offset="1" stop-color="#0a2a5e"/>
    </linearGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfe6f0"/>
    </linearGradient>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".35"/>
    </filter>
    <radialGradient id="brilloR"><stop offset="0" stop-color="#ff8a8d"/><stop offset="1" stop-color="#e5484d"/></radialGradient>
    <radialGradient id="brilloA"><stop offset="0" stop-color="#ffd27a"/><stop offset="1" stop-color="#f5a524"/></radialGradient>
    <radialGradient id="brilloV"><stop offset="0" stop-color="#7ef0a6"/><stop offset="1" stop-color="#30a46c"/></radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#fondo)"/>
  <!-- calles del mapa -->
  <g stroke="#ffffff" stroke-opacity=".14" stroke-width="18" fill="none" stroke-linecap="round">
    <path d="M-20 140 L540 70"/><path d="M-20 330 L540 260"/><path d="M120 -20 L60 540"/><path d="M420 -20 L380 540"/>
    <path d="M-20 470 Q256 380 540 450"/>
  </g>
  <!-- río Ebro -->
  <path d="M-20 410 C120 360 220 440 330 395 S470 350 540 380" stroke="#5ec8ff" stroke-opacity=".55" stroke-width="22" fill="none" stroke-linecap="round"/>
  <!-- chincheta con semáforo -->
  <g filter="url(#sombra)">
    <path d="M256 54 C176 54 120 112 120 186 C120 270 214 352 256 440 C298 352 392 270 392 186 C392 112 336 54 256 54Z" fill="url(#pin)"/>
    <rect x="210" y="96" width="92" height="200" rx="34" fill="#1c2024"/>
    <circle cx="256" cy="134" r="25" fill="url(#brilloR)"/>
    <circle cx="256" cy="196" r="25" fill="url(#brilloA)"/>
    <circle cx="256" cy="258" r="25" fill="url(#brilloV)"/>
  </g>
</svg>

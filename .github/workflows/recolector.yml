name: Recolector de datos de tráfico

on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"   # cada 10 minutos, en minutos poco saturados (GitHub puede retrasarlo)
  workflow_dispatch: {}      # botón para lanzarlo a mano

permissions:
  contents: write

concurrency:
  group: recolector
  cancel-in-progress: false

jobs:
  recoger:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Descargar datos y actualizar histórico
        run: python collector/collect.py
      - name: Guardar cambios en el repositorio
        run: |
          git config user.name "recolector-trafico"
          git config user.email "recolector-trafico@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -q -m "Datos $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 5; done
          exit 1
